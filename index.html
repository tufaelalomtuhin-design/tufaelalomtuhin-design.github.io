<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{background:#0f172a; color:white; text-align:center; font-family:sans-serif; padding:20px; line-height:1.6}
    img{width:180px; border-radius:50%; border:3px solid #00f5ff}
    h1, h2{color:#00f5ff}
    .btn-link{display:inline-block; padding:12px 20px; margin:5px; border-radius:8px; text-decoration:none; color:white; font-weight:bold}
    .fb{background:#1877f2} .wa{background:#25D366} .mail{background:#EA4335}
    .react-area{margin-top:30px}
    .react-btn{font-size:28px; background:#1e293b; border:none; padding:10px 15px; margin:5px; border-radius:12px; color:white; cursor:pointer}
    .react-btn:hover{background:#334155}
    .reset{background:#dc2626; font-size:14px; padding:8px 12px; margin-top:10px}
  </style>
</head>
<body>

<h1>Tufael Alom Tuhin TLM</h1>
<p>আমার প্রথম ওয়েবসাইট - Termux দিয়ে বানানো</p>
<img src="tuhin.jpg" alt="Tuhin">

<h2>আমার সম্পর্কে</h2>
<p>আসসালামু আলাইকুম। আমি Tufael Alom Tuhin।<br>এটা আমার বানানো প্রথম ওয়েবসাইট।</p>

<h2>যোগাযোগ</h2>
<a href="https://www.facebook.com/tufael" class="btn-link fb">Facebook</a>
<a href="https://wa.me/8801894398350" class="btn-link wa" target="_blank">WhatsApp</a>
<a href="mailto:tufaelalomtuhin@gmail.com" class="btn-link mail">Email</a>

<div class="react-area">
  <h2>রিয়েক্ট দাও 👇</h2>
  <div id="reactButtons"></div>
  <button id="resetBtn" class="react-btn reset">Reset</button>
</div>

<p style="margin-top:50px; color:#555">© 2026 Tufael Alom Tuhin. All rights reserved.</p>

<script>
  let counts = JSON.parse(localStorage.getItem('reactCounts')) || {like:0, love:0, haha:0, wow:0};
  let userReact = localStorage.getItem('userReact');
  const reacts = {like:'👍', love:'❤️', haha:'😂', wow:'😮'};
  const reactButtonsDiv = document.getElementById('reactButtons');
  const resetBtn = document.getElementById('resetBtn');

  function renderButtons() {
    reactButtonsDiv.innerHTML = '';
    for (let id in reacts) {
      const btn = document.createElement('button');
      btn.className = 'react-btn';
      btn.innerHTML = `${reacts[id]} <span>${counts[id]}</span>`;
      btn.onclick = () => handleReact(id);
      reactButtonsDiv.appendChild(btn);
    }
    resetBtn.style.display = userReact ? 'inline-block' : 'none';
  }

  function handleReact(id) {
    if (userReact && userReact !== id) { counts[userReact]--; }
    if (userReact === id) { counts[id]--; userReact = null; } 
    else { counts[id]++; userReact = id; }
    localStorage.setItem('reactCounts', JSON.stringify(counts));
    localStorage.setItem('userReact', userReact);
    renderButtons();
  }

  resetBtn.addEventListener('click', () => {
    if (userReact) {
      counts[userReact]--; userReact = null;
      localStorage.setItem('reactCounts', JSON.stringify(counts));
      localStorage.setItem('userReact', '');
      renderButtons();
    }
  });

  renderButtons();
</script>

</body>
</html>
